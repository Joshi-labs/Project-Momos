services:
  # 1. PocketBase Backend & Database
  pocketbase:
    image: ghcr.io/muchobien/pocketbase:latest
    container_name: momos-pocketbase
    restart: unless-stopped
    ports:
      - "8090:8090"
    volumes:
      - pb_data:/pb/pb_data
    environment:
      - POCKETBASE_ENCRYPTION_KEY=${POCKETBASE_ENCRYPTION_KEY:-}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8090/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # 2. FastAPI Application Server (Serves API + React Frontend)
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/${GITHUB_REPOSITORY:-joshi-labs/project-momos}:latest
    container_name: momos-web
    restart: unless-stopped
    depends_on:
      pocketbase:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      - POCKETBASE_URL=http://pocketbase:8090
      - POCKETBASE_ADMIN_EMAIL=${POCKETBASE_ADMIN_EMAIL:-admin@vpjoshi.in}
      - POCKETBASE_ADMIN_PASSWORD=${POCKETBASE_ADMIN_PASSWORD:-AdminPass123456!}
      - CORS_ORIGINS=*
      - PORT=8000
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  # 3. Watchtower (Automated CD Image Updater via Webhook)
  watchtower:
    image: containrrr/watchtower:latest
    container_name: momos-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_HTTP_API_UPDATE=true
      - WATCHTOWER_HTTP_API_TOKEN=${WATCHTOWER_TOKEN:-secret-watchtower-token}
      - WATCHTOWER_LABEL_ENABLE=true
      - WATCHTOWER_CLEANUP=true
    ports:
      - "8080:8080"

volumes:
  pb_data:
